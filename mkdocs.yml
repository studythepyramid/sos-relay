site_name: SOS Relay
site_url: https://sosweb.org/
site_description: Signal relay and knowledge base for emergency communication under shutdown/censorship conditions.
docs_dir: docs
site_dir: site

extra:
  homepage: https://sosweb.org/

theme:
  name: material
  favicon: assets/site-icon.png
  logo: assets/site-icon.png
  language: en
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

hooks:
  - scripts/homepage.py

extra_javascript:
  - assets/voice-widget.js
  - assets/capability-probe.js

extra_css:
  - assets/voice-widget.css
  - assets/site-theme.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  # scripts/homepage.py supplies index.md from root-level za-index.md.
  - Home: index.md
  - SOS map (preview): map/index.html
  - Belt & Road: belt-road/index.html

  # Categories is more important for me
  #
  # about.md should be left along for user editing
  - About: about.md

  - Doors to the real Internet: doors.2026-09.md

  - Voice samples:
      - English: samples/tts-stt-en.md
      - Chinese: samples/tts-stt-cn.md
  - Guide:
      - TTS/STT (offline): guide/tts-stt.md
  - Notes:
      - Client-side TTS/STT design: notes/web-ttsstt.md
