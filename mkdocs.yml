site_name: SOS Relay
site_description: Signal relay and knowledge base for emergency communication under shutdown/censorship conditions.
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

extra_javascript:
  - assets/voice-widget.js
  - assets/capability-probe.js

extra_css:
  - assets/voice-widget.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  # index.md or index.html should be script generated
  # list the contents of folder, group sub-folder together
  - Home: index.md
  - SOS map (preview): map/index.html

  # Categories is more important for me
  #
  # about.md should be left along for user editing
  - About: about.md

  - Doors to the real Internet: doors.2026-09.md

  - Voice samples:
      - English: samples/tts-stt-en.md
      - Chinese: samples/tts-stt-cn.md
  - Guide:
      - TTS/STT (offline): guide/tts-stt.md
  - Notes:
      - Client-side TTS/STT design: notes/web-ttsstt.md
